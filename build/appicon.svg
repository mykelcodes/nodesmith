<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 24 24">
  <!--
    The two paths, the stroke weight, and the round caps and joins are the same
    mark the application draws for `Icon name="logo"`, and the mark is a single
    colour there rather than a two-tone outline. Only the plate behind it is
    added, so the desktop icon and the in-app logo read as one thing.
  -->
  <defs>
    <linearGradient id="plate" x1="3" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181E2B"/>
      <stop offset="1" stop-color="#090B10"/>
    </linearGradient>
    <linearGradient id="mark" x1="4" y1="3" x2="20" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A89BFF"/>
      <stop offset="1" stop-color="#6CB8FF"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="22" height="22" rx="5.25" fill="url(#plate)"/>
  <g fill="none" stroke="url(#mark)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.75 20 7.25v9.5L12 21.25 4 16.75v-9.5L12 2.75Z"/>
    <path d="m8.25 9.25 3.75-2.1 3.75 2.1v4.5L12 15.9l-3.75-2.15v-4.5Z"/>
  </g>
</svg>
