name: CI

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go lint
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux desktop build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted. Run 'task go:format':"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          # Schema verification downloads a versioned JSON schema at runtime.
          # Keep linting deterministic when golangci-lint.run is unavailable.
          verify: false
          args: ./...

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux desktop build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Scan module graph for known vulnerabilities
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  test-and-build:
    name: Test and build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal
            os: macos-15
            platform: darwin/universal
            artifact: darwin-universal
            cgo_ldflags: -mmacosx-version-min=10.13 -framework UniformTypeIdentifiers
          - label: Windows amd64
            os: windows-2022
            platform: windows/amd64
            artifact: windows-amd64
            cgo_ldflags: ""
          - label: Linux amd64
            os: ubuntu-22.04
            platform: linux/amd64
            artifact: linux-amd64
            cgo_ldflags: ""

    env:
      CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails v2.13.0
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify Wails CLI
        shell: bash
        run: wails version

      - name: Install frontend dependencies
        shell: bash
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        shell: bash
        run: pnpm --dir frontend exec playwright install chromium

      - name: Test Go packages
        shell: bash
        run: go test ./... -count=1 -coverprofile=coverage.out

      - name: Report Go coverage
        shell: bash
        run: |
          go tool cover -func=coverage.out | tail -n 40
          go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

      # Runs on every platform: the Windows-specific concurrency paths
      # (taskkill termination, CREATE_NEW_PROCESS_GROUP, case-insensitive env
      # merging) are exactly the ones a Linux-only race build never exercises.
      - name: Run Go race tests
        shell: bash
        run: go test ./... -race -count=1

      - name: Vet Go packages
        shell: bash
        run: go vet ./...

      - name: Type-check frontend
        shell: bash
        run: pnpm --dir frontend run check

      - name: Lint frontend
        shell: bash
        run: pnpm --dir frontend run lint

      - name: Test frontend
        shell: bash
        run: pnpm --dir frontend run test

      - name: Verify generated bindings
        shell: bash
        run: |
          wails generate module
          node frontend/scripts/normalize-wails-bindings.mjs
          git diff --exit-code -- frontend/src/lib/wailsjs

      - name: Build desktop application
        shell: bash
        run: wails build -clean -trimpath -platform "${{ matrix.platform }}"

      - name: Package macOS release asset
        if: github.ref_type == 'tag' && runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/Nodesmith.app \
            "release-assets/nodesmith-${RELEASE_TAG}-darwin-universal.zip"

      - name: Package Windows release asset
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force release-assets
          Compress-Archive `
            -LiteralPath build/bin/nodesmith.exe `
            -DestinationPath "release-assets/nodesmith-$env:RELEASE_TAG-windows-amd64.zip"

      - name: Package Linux release asset
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          tar --create --gzip \
            --file "release-assets/nodesmith-${RELEASE_TAG}-linux-amd64.tar.gz" \
            --directory build/bin \
            nodesmith

      - name: Upload commit desktop artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: nodesmith-${{ matrix.artifact }}-${{ github.sha }}
          path: build/bin/
          if-no-files-found: error
          retention-days: 14

      - name: Upload versioned tag desktop artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: nodesmith-${{ github.ref_name }}-${{ matrix.artifact }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - go-lint
      - govulncheck
      - test-and-build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v8
        with:
          pattern: nodesmith-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum nodesmith-* > SHA256SUMS

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Nodesmith $RELEASE_TAG"
