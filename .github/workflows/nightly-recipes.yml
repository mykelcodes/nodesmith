name: Nightly recipe verification

"on":
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-recipe-verification
  cancel-in-progress: true

jobs:
  contracts:
    name: Offline contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2022
          - ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate manifests and committed golden plans
        shell: bash
        run: go test ./internal/recipe ./internal/planner ./cmd/recipecheck -count=1

  execute:
    name: Execute ${{ matrix.recipe.id }} (${{ matrix.platform.label }})
    needs: contracts
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        platform:
          - label: macOS
            os: macos-15
            cgo_ldflags: -mmacosx-version-min=10.13 -framework UniformTypeIdentifiers
          - label: Windows
            os: windows-2022
            cgo_ldflags: ""
          - label: Linux
            os: ubuntu-22.04
            cgo_ldflags: ""
        recipe:
          - id: astro
            smoke: >-
              [{"label":"Build Astro project","bin":"npm","args":["run","build"]}]
          - id: electron
            smoke: >-
              [{"label":"Package Electron application","bin":"npm","args":["run","package"]}]
          - id: expo
            smoke: >-
              [{"label":"Export Expo web application","bin":"npx","args":["expo","export","--platform","web","--output-dir","dist"]}]
          - id: express
            smoke: >-
              [{"label":"Check Express application syntax","bin":"node","args":["--check","app.js"]},{"label":"Check Express launcher syntax","bin":"node","args":["--check","bin/www"]}]
          - id: hono
            smoke: >-
              [{"label":"Build Hono project","bin":"npm","args":["run","build"]}]
          - id: nestjs
            smoke: >-
              [{"label":"Build NestJS project","bin":"npm","args":["run","build"]}]
          - id: next
            smoke: >-
              [{"label":"Build Next.js project","bin":"npm","args":["run","build"]}]
          - id: react
            smoke: >-
              [{"label":"Build React project","bin":"npm","args":["run","build"]}]
          - id: solid
            smoke: >-
              [{"label":"Build Solid project","bin":"npm","args":["run","build"]}]
          - id: svelte
            smoke: >-
              [{"label":"Build Svelte project","bin":"npm","args":["run","build"]}]
          - id: sveltekit
            smoke: >-
              [{"label":"Build SvelteKit project","bin":"npm","args":["run","build"]}]
          - id: tauri
            smoke: >-
              [{"label":"Build Tauri application","bin":"npm","args":["run","tauri","--","build","--no-bundle"]}]
          - id: vite
            smoke: >-
              [{"label":"Build Vite project","bin":"npm","args":["run","build"]}]
          - id: wails
            smoke: >-
              [{"label":"Build Wails v2 application","bin":"wails","args":["build","-clean","-nopackage","-nocolour","-trimpath"]}]

    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      CGO_LDFLAGS: ${{ matrix.platform.cgo_ldflags }}
      CI: "1"
      DO_NOT_TRACK: "1"
      EXPO_NO_TELEMETRY: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NO_COLOR: "1"
      RECIPECHECK_RECIPE: ${{ matrix.recipe.id }}
      RECIPECHECK_SMOKE_JSON: ${{ matrix.recipe.smoke }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux' && matrix.recipe.id == 'wails'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux' && matrix.recipe.id == 'tauri'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ matrix.recipe.id }}-${{ hashFiles(format('recipes/{0}.json', matrix.recipe.id)) }}
          restore-keys: |
            npm-${{ runner.os }}-${{ matrix.recipe.id }}-
            npm-${{ runner.os }}-

      - name: Install Rust
        if: matrix.recipe.id == 'tauri'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Wails v2.13.0
        if: matrix.recipe.id == 'wails'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify recipe end to end
        shell: bash
        run: |
          go run ./cmd/recipecheck \
            -manifest "recipes/${RECIPECHECK_RECIPE}.json" \
            -recipe "$RECIPECHECK_RECIPE" \
            -package-manager npm \
            -temp-root "$RUNNER_TEMP" \
            -scaffold-timeout 25m \
            -smoke-timeout 25m

  notify-failure:
    name: Report nightly recipe failure
    if: ${{ always() && (needs.contracts.result == 'failure' || needs.execute.result == 'failure') }}
    needs:
      - contracts
      - execute
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        uses: actions/github-script@v9
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          EXECUTE_RESULT: ${{ needs.execute.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          retries: 3
          script: |
            const marker = '<!-- nodesmith-nightly-recipe-failure -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runURL = process.env.RUN_URL;
            const resultLines = [
              `- Offline contracts: \`${process.env.CONTRACTS_RESULT}\``,
              `- Recipe execution matrix: \`${process.env.EXECUTE_RESULT}\``,
              `- Commit: \`${process.env.SOURCE_SHA}\``,
              `- Workflow run: ${runURL}`,
            ];
            const update = [
              'The nightly recipe verification failed again.',
              '',
              ...resultLines,
            ].join('\n');
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 },
            );
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: update,
              });
              core.info(`Updated existing issue #${existing.number}`);
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title: '[CI] Nightly recipe verification failed',
              body: [
                marker,
                'A bundled recipe or its offline contract failed nightly verification.',
                'This issue remains the deduplication target until it is closed.',
                '',
                ...resultLines,
              ].join('\n'),
            });
